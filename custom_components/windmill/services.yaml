run:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: windmill
    kind:
      required: true
      selector:
        select:
          options:
            - script
            - flow
    path:
      required: true
      example: u/automation/lights
      selector:
        text:
    arguments:
      required: false
      example: '{"room": "kitchen"}'
      selector:
        object:
cancel:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: windmill
    job_id:
      required: true
      example: 00000000-0000-4000-8000-000000000001
      selector:
        text:
