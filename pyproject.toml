[project]
name = "ha-windmill-dev"
version = "0.3.0"
description = "Secure asynchronous Home Assistant integration for Windmill"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  "mypy==2.3.0",
  "pytest-homeassistant-custom-component==0.13.348",
  "ruff==0.16.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["custom_components.windmill"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
